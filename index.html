<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">

<meta name="description" content="シャッター音が鳴らないカメラ。寝ている赤ちゃんやペット、静かな場所での記録に。無料・広告なし・登録なし。">

<meta property="og:title" content="しずかカメラ">
<meta property="og:description" content="シャッター音が鳴らないカメラ。寝ている赤ちゃんやペット、静かな場所での記録に。無料・広告なし・登録なし。">

<style>
  :root { color-scheme: dark; --bg: #0e1015; --panel: rgba(14, 16, 21, .78); --fg: #f4f1ea; --mute: #a9a59c; --accent: #ffb46b; --line: rgba(255,255,255,.14); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg);
    font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic UI", "Meiryo", "Noto Sans JP", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none; overscroll-behavior: none; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; touch-action: manipulation; }
  [hidden] { display: none !important; }

  /* ---------- カメラの画面 ---------- */
  #stage { position: fixed; inset: 0; overflow: hidden; background: #000; }
  #video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; transform-origin: 50% 50%; }
  #video.mirror { transform: scaleX(-1); }
  #grid { position: absolute; inset: 0; pointer-events: none;
    background-image: linear-gradient(to right, transparent calc(33.33% - .5px), rgba(255,255,255,.35) calc(33.33% - .5px), rgba(255,255,255,.35) calc(33.33% + .5px), transparent calc(33.33% + .5px), transparent calc(66.66% - .5px), rgba(255,255,255,.35) calc(66.66% - .5px), rgba(255,255,255,.35) calc(66.66% + .5px), transparent calc(66.66% + .5px)),
      linear-gradient(to bottom, transparent calc(33.33% - .5px), rgba(255,255,255,.35) calc(33.33% - .5px), rgba(255,255,255,.35) calc(33.33% + .5px), transparent calc(33.33% + .5px), transparent calc(66.66% - .5px), rgba(255,255,255,.35) calc(66.66% - .5px), rgba(255,255,255,.35) calc(66.66% + .5px), transparent calc(66.66% + .5px)); }
  /* 撮ったしるし: 画面が白く光る(音のかわり) */
  #flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
  #flash.on { animation: flash .38s ease-out; }
  @keyframes flash { 0% { opacity: .9; } 100% { opacity: 0; } }

  #top { position: fixed; left: 0; right: 0; top: 0; display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) max(14px, env(safe-area-inset-right, 0px)) 10px max(14px, env(safe-area-inset-left, 0px));
    background: linear-gradient(to bottom, rgba(0,0,0,.55), transparent); }
  .chip { white-space: nowrap; flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: 999px; background: var(--panel);
    border: 1px solid var(--line); font-size: 15px; font-weight: 700; }
  .chip.on { background: var(--fg); color: #111; }
  #silent { height: 34px; display: inline-flex; align-items: center; padding: 0 12px; border-radius: 999px; background: var(--panel); font-size: 13px; font-weight: 700; color: var(--accent); white-space: nowrap; }
  #zooms { position: fixed; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + 132px); display: flex; justify-content: center; gap: 10px; }
  #zooms button { width: 46px; height: 46px; border-radius: 50%; background: var(--panel); border: 1px solid var(--line); font-size: 14px; font-weight: 800; }
  #zooms button.on { color: var(--accent); border-color: var(--accent); }

  #bottom { position: fixed; left: 0; right: 0; bottom: 0; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
    padding: 18px max(22px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 22px) max(22px, env(safe-area-inset-left, 0px));
    background: linear-gradient(to top, rgba(0,0,0,.7), transparent); }
  #thumb { justify-self: start; position: relative; width: 58px; height: 58px; border-radius: 12px; overflow: hidden; border: 2px solid rgba(255,255,255,.8);
    background: #222 center/cover no-repeat; }
  #thumb.empty { border-style: dashed; border-color: rgba(255,255,255,.35); }
  #count { position: absolute; right: -2px; top: -2px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: var(--accent);
    color: #111; font-size: 12px; font-weight: 900; line-height: 22px; text-align: center; }
  #shutter { width: 82px; height: 82px; border-radius: 50%; border: 5px solid #fff; padding: 5px; }
  #shutter span { display: block; width: 100%; height: 100%; border-radius: 50%; background: #fff; transition: transform .1s; }
  #shutter:active span { transform: scale(.86); }
  #flip { justify-self: end; width: 58px; height: 58px; border-radius: 50%; background: var(--panel); border: 1px solid var(--line); font-size: 26px; }

  /* ---------- はじめ・困ったとき ---------- */
  .sheet { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center;
    padding: calc(env(safe-area-inset-top, 0px) + 24px) max(24px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 24px) max(24px, env(safe-area-inset-left, 0px));
    background: var(--bg); overflow-y: auto; }
  .sheet h1 { margin: 0; font-size: 30px; font-weight: 900; letter-spacing: .04em; }
  .sheet p { margin: 0; max-width: 30em; line-height: 1.8; color: var(--mute); font-size: 15px; }
  .sheet p b { color: var(--fg); }
  .big { min-width: 240px; padding: 16px 28px; border-radius: 999px; background: var(--accent); color: #111; font-size: 19px; font-weight: 900; }
  .sub { padding: 12px 22px; border-radius: 999px; border: 1px solid var(--line); font-size: 15px; font-weight: 700; }
  .rule { max-width: 30em; padding: 14px 16px; border-radius: 14px; border: 1px solid var(--line); text-align: left; font-size: 14px; line-height: 1.75; color: var(--mute); }
  .rule b { color: var(--fg); }

  /* ---------- 撮った写真 ---------- */
  #gallery { position: fixed; inset: 0; display: flex; flex-direction: column; background: var(--bg); }
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 8px;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) max(14px, env(safe-area-inset-right, 0px)) 10px max(14px, env(safe-area-inset-left, 0px));
    border-bottom: 1px solid var(--line); }
  .bar h2 { margin: 0; min-width: 0; flex: 1; text-align: center; font-size: 16px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar .chip { height: 36px; padding: 0 12px; font-size: 14px; }
  #grid2 { flex: 1; overflow-y: auto; display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; padding: 3px; align-content: start; }
  #grid2 button { position: relative; aspect-ratio: 1; background: #222 center/cover no-repeat; border-radius: 4px; }
  #grid2 button { -webkit-touch-callout: none; }
  #vwImg { -webkit-touch-callout: default; }
  #grid2 button.sel { outline: 3px solid var(--accent); outline-offset: -3px; }
  #grid2.selecting button:not(.sel) { opacity: .55; }
  #grid2 button .ck { position: absolute; top: 5px; right: 5px; width: 24px; height: 24px; border-radius: 50%; border: 2px solid #fff; background: rgba(0,0,0,.35);
    display: none; align-items: center; justify-content: center; font-size: 14px; font-weight: 900; color: #111; }
  #grid2.selecting button .ck { display: flex; }
  #grid2 button.sel .ck { background: var(--accent); border-color: var(--accent); }
  .selbar { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; border-top: 1px solid var(--line);
    padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 14px) max(16px, env(safe-area-inset-left, 0px)); }
  .selbar .big { min-width: 0; padding: 14px 24px; font-size: 17px; }
  .note .chip { margin-top: 10px; background: var(--accent); color: #111; font-weight: 800; }
  #grid2 button.saved::after { content: "保存ずみ"; position: absolute; left: 4px; bottom: 4px; padding: 1px 6px; border-radius: 6px; background: rgba(0,0,0,.6); font-size: 10px; font-weight: 700; }
  .note { padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 14px) max(16px, env(safe-area-inset-left, 0px));
    border-top: 1px solid var(--line); color: var(--mute); font-size: 13px; line-height: 1.7; }
  .empty-msg { grid-column: 1 / -1; padding: 60px 20px; text-align: center; color: var(--mute); line-height: 1.8; }

  #viewer { position: fixed; inset: 0; display: flex; flex-direction: column; background: #000; }
  #viewer .img { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; }
  #viewer img { max-width: 100%; max-height: 100%; object-fit: contain; }
  #viewer .acts { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;
    padding: 14px max(16px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 18px) max(16px, env(safe-area-inset-left, 0px)); }
  #viewer .acts .big { min-width: 0; }
  #toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 150px); transform: translateX(-50%); padding: 10px 18px; border-radius: 999px;
    background: rgba(0,0,0,.78); font-size: 14px; font-weight: 700; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .2s; }
  #toast.on { opacity: 1; }
  #confirm { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.6); padding: 24px; }
  #confirm .box { width: 100%; max-width: 340px; padding: 22px; border-radius: 18px; background: #1b1e26; text-align: center; }
  #confirm p { margin: 0 0 18px; line-height: 1.7; }
  #confirm .row { display: flex; gap: 10px; justify-content: center; }
</style>
</head>
<body>

<div id="stage">
  <video id="video" playsinline muted autoplay></video>
  <div id="grid" hidden></div>
  <div id="flash"></div>
</div>

<div id="top">
  <span id="silent">🔇 シャッター音なし</span>
  <span style="display:flex;gap:8px">
    <button id="gridBtn" class="chip" type="button" aria-pressed="false">＃ 線</button>
  </span>
</div>
<div id="zooms"></div>
<div id="bottom">
  <button id="thumb" class="empty" type="button" aria-label="撮った写真を見る"><span id="count" hidden>0</span></button>
  <button id="shutter" type="button" aria-label="撮る"><span></span></button>
  <button id="flip" type="button" aria-label="前と後ろのカメラを切りかえる">🔄</button>
</div>
<div id="toast"></div>

<!-- はじめの画面(カメラを使う前) -->
<div id="start" class="sheet">
  <div style="font-size:64px">📷</div>
  <h1>しずかカメラ</h1>
  <p>シャッターの音が<b>鳴らない</b>カメラです。<br>寝ている赤ちゃんやペット、静かな場所での記録に。</p>
  <button id="startBtn" class="big" type="button">カメラをひらく</button>
  <div class="rule">
    <b>おやくそく</b><br>
    人を、その人の知らないうちに撮らないでください。<br>
    撮ってはいけない場所(お店・電車の中・美術館など)の決まりも守ってください。
  </div>
</div>

<!-- カメラが使えないとき -->
<div id="trouble" class="sheet" hidden>
  <div style="font-size:52px">🙏</div>
  <h1 style="font-size:24px" id="trTitle">カメラが使えませんでした</h1>
  <p id="trBody"></p>
  <button id="retryBtn" class="big" type="button">もう一度ためす</button>
  <button id="toGallery" class="sub" type="button">撮った写真を見る</button>
</div>

<!-- 撮った写真の一覧 -->
<div id="gallery" hidden>
  <div class="bar">
    <button id="galBack" class="chip" type="button">← カメラ</button>
    <h2 id="galTitle">0枚</h2>
    <button id="selBtn" class="chip" type="button">えらぶ</button>
  </div>
  <div id="grid2"></div>
  <div class="note" id="galNote">写真は、まだ<b>このアプリの中</b>にあります。保存すると、スマホの写真アプリに入ります。写真を<b>長押し</b>すると、えらんで保存・削除できます。
    <div><button id="saveAll" class="chip" type="button">まだ保存していない写真を保存</button></div></div>
  <div class="selbar" id="selBar" hidden>
    <button id="selSave" class="big" type="button">📥 保存</button>
    <button id="selDel" class="sub" type="button">🗑 消す</button>
  </div>
</div>

<!-- 1枚を大きく見る -->
<div id="viewer" hidden>
  <div class="bar" style="border-color:transparent">
    <button id="vwBack" class="chip" type="button">← 一覧</button>
    <h2 id="vwTitle"></h2>
    <span style="width:70px"></span>
  </div>
  <div class="img"><img id="vwImg" alt="撮った写真"></div>
  <div class="acts">
    <button id="vwSave" class="big" type="button">📥 写真アプリに保存</button>
    <button id="vwDel" class="sub" type="button">🗑 消す</button>
  </div>
</div>

<div id="confirm" hidden>
  <div class="box">
    <p id="cfMsg"></p>
    <div class="row"><button id="cfNo" class="sub" type="button">やめる</button><button id="cfYes" class="big" style="min-width:0" type="button">消す</button></div>
  </div>
</div>

<canvas id="cv" hidden></canvas>

<script>
'use strict';
/* しずかカメラ
 * - シャッター音が鳴らないのは、スマホのカメラアプリを使わず、ブラウザが見ているカメラの映像から
 *   1コマを写し取って写真にしているから。音を出す命令は1つも使っていない(WebAudio・audio なし)。
 * - 撮った写真は、まずこのアプリの中(IndexedDB)にしまう。「保存」で共有の画面を出し、写真アプリに入れてもらう
 *   (ブラウザのアプリは、だまって写真アプリに入れることができない決まり)。
 * - 隠れて撮る使い方をさせないため、画面を暗くしたまま撮る・別のアプリのふりをする などのしかけは入れない。
 */
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var video = $('video'), cv = $('cv');
  var ua = navigator.userAgent || '';
  var isIOS = /iPhone|iPad|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  var isLine = / Line\//i.test(ua);
  var stream = null, track = null, facing = 'environment', zoom = 1, hwZoom = null, wake = null, starting = false;
  var ZOOMS = [1, 2, 3];
  var photos = [];   // {id, t, w, h, thumb(Blob), saved}
  var urls = {};     // id → 一覧用の小さい画像の URL

  function store(k, v) { try { if (v === undefined) return localStorage.getItem('shizuka.' + k); localStorage.setItem('shizuka.' + k, v); } catch (e) { return null; } }
  function toast(msg) { var t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.tm); toast.tm = setTimeout(function () { t.classList.remove('on'); }, 1600); }
  function show(id, on) { $(id).hidden = !on; }

  // ---------- しまう場所(IndexedDB) ----------
  var dbp = null;
  function db() {
    if (dbp) return dbp;
    dbp = new Promise(function (res, rej) {
      var r = indexedDB.open('shizuka-camera', 1);
      r.onupgradeneeded = function () { var d = r.result; d.createObjectStore('photos', { keyPath: 'id' }); d.createObjectStore('full', { keyPath: 'id' }); };
      r.onsuccess = function () { res(r.result); };
      r.onerror = function () { rej(r.error); };
    });
    return dbp;
  }
  function tx(stores, mode, fn) {
    return db().then(function (d) {
      return new Promise(function (res, rej) {
        var t = d.transaction(stores, mode), out;
        t.oncomplete = function () { res(out); };
        t.onerror = t.onabort = function () { rej(t.error); };
        out = fn(t);
      });
    });
  }
  function getAll() {
    return db().then(function (d) {
      return new Promise(function (res, rej) {
        var r = d.transaction('photos').objectStore('photos').getAll();
        r.onsuccess = function () { res(r.result || []); }; r.onerror = function () { rej(r.error); };
      });
    });
  }
  function getFull(id) {
    return db().then(function (d) {
      return new Promise(function (res, rej) {
        var r = d.transaction('full').objectStore('full').get(id);
        r.onsuccess = function () { res(r.result && r.result.blob); }; r.onerror = function () { rej(r.error); };
      });
    });
  }
  // 保存した写真は、スマホが勝手に消さないようにたのむ(ホーム画面に入れると、ほぼ消えない)
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}

  // ---------- カメラ ----------
  function stopCam() {
    if (stream) stream.getTracks().forEach(function (t) { t.stop(); });
    stream = null; track = null;
    if (wake) { try { wake.release(); } catch (e) {} wake = null; }
  }
  function startCam() {
    if (starting) return;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return trouble('nosupport');
    starting = true; stopCam();
    var want = { video: { facingMode: { ideal: facing }, width: { ideal: 4096 }, height: { ideal: 3072 } }, audio: false };
    navigator.mediaDevices.getUserMedia(want).catch(function (e) {
      // 大きさの注文が合わない機種のときは、注文なしでもう一度
      if (e && (e.name === 'OverconstrainedError' || e.name === 'NotReadableError')) return navigator.mediaDevices.getUserMedia({ video: { facingMode: facing }, audio: false });
      throw e;
    }).then(function (s) {
      starting = false; stream = s; track = s.getVideoTracks()[0];
      video.srcObject = s; video.muted = true;
      var p = video.play(); if (p && p.catch) p.catch(function () {});
      video.classList.toggle('mirror', facing === 'user');
      store('started', '1');
      show('start', false); show('trouble', false);
      setupZoom();
      try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then(function (w) { wake = w; }, function () {}); } catch (e) {}
    }).catch(function (e) { starting = false; trouble(e && e.name); });
  }
  function trouble(kind) {
    var body;
    if (kind === 'NotAllowedError' || kind === 'SecurityError') {
      body = isLine ? 'LINE の中では、カメラが使えないことがあります。<br>右上(または右下)のメニューから<b>「' + (isIOS ? 'Safari' : 'ブラウザ') + 'で開く」</b>を選んでください。'
        : isIOS ? 'カメラを使ってよいか、の確認で「許可しない」になっています。<br>アドレスの横の <b>「ぁあ」</b> → <b>Web サイトの設定</b> → <b>カメラ</b> を「許可」にしてから、もう一度ためしてください。'
        : 'カメラを使ってよいか、の確認で「ブロック」になっています。<br>アドレスの横の <b>鍵のしるし</b> → <b>権限</b> → <b>カメラ</b> を「許可」にしてから、もう一度ためしてください。';
    } else if (kind === 'NotFoundError' || kind === 'OverconstrainedError') {
      body = 'この機械には、使えるカメラが見つかりませんでした。';
    } else if (kind === 'NotReadableError') {
      body = 'ほかのアプリがカメラを使っているかもしれません。ほかのアプリを閉じてから、もう一度ためしてください。';
    } else if (kind === 'nosupport') {
      body = isLine ? 'LINE の中では、カメラが使えません。<br>メニューから<b>「' + (isIOS ? 'Safari' : 'ブラウザ') + 'で開く」</b>を選んでください。'
        : 'このブラウザでは、カメラが使えません。' + (isIOS ? '<b>Safari</b>' : '<b>Chrome</b>') + 'で開いてください。';
    } else {
      body = 'うまくカメラにつながりませんでした。もう一度ためしてください。';
    }
    $('trBody').innerHTML = body;
    show('start', false); show('trouble', true);
  }

  // ---------- ズーム(カメラが自分でできれば、それを使う。できなければ、まん中を切り取る) ----------
  function setupZoom() {
    hwZoom = null;
    try {
      var c = track.getCapabilities && track.getCapabilities();
      if (c && c.zoom && c.zoom.max > 1) hwZoom = c.zoom;
    } catch (e) {}
    var box = $('zooms'); box.innerHTML = '';
    var max = hwZoom ? Math.min(hwZoom.max, 3) : 3;
    ZOOMS.filter(function (z) { return z <= max + 0.01; }).forEach(function (z) {
      var b = document.createElement('button'); b.type = 'button'; b.textContent = z + '×';
      b.onclick = function () { setZoom(z); b.blur(); };
      box.appendChild(b);
    });
    setZoom(1);
  }
  function setZoom(z) {
    zoom = z;
    [].forEach.call($('zooms').children, function (b) { b.classList.toggle('on', parseFloat(b.textContent) === z); });
    if (hwZoom) {
      var v = Math.max(hwZoom.min || 1, Math.min(hwZoom.max, z));
      track.applyConstraints({ advanced: [{ zoom: v }] }).catch(function () {});
      video.style.transform = facing === 'user' ? 'scaleX(-1)' : '';
    } else {
      video.style.transform = (facing === 'user' ? 'scaleX(-1) ' : '') + 'scale(' + z + ')';
    }
  }

  // ---------- 撮る ----------
  function shoot() {
    var vw = video.videoWidth, vh = video.videoHeight;
    if (!stream || !vw || !vh) { toast('カメラの準備中です'); return; }
    var dz = hwZoom ? 1 : zoom;                       // 切り取りで寄るときだけ
    var sw = Math.round(vw / dz), sh = Math.round(vh / dz), sx = Math.round((vw - sw) / 2), sy = Math.round((vh - sh) / 2);
    cv.width = sw; cv.height = sh;
    var g = cv.getContext('2d');
    g.setTransform(1, 0, 0, 1, 0, 0);               // 前のカメラでも、写真は鏡にしない(ふつうのカメラと同じ)
    g.drawImage(video, sx, sy, sw, sh, 0, 0, sw, sh);
    var fl = $('flash'); fl.classList.remove('on'); void fl.offsetWidth; fl.classList.add('on');
    var t = Date.now();
    cv.toBlob(function (full) {
      if (!full) { toast('うまく撮れませんでした'); return; }
      // 一覧用の小さい画像
      var k = 360 / Math.max(sw, sh), tw = Math.round(sw * k), th = Math.round(sh * k);
      var c2 = document.createElement('canvas'); c2.width = tw; c2.height = th;
      c2.getContext('2d').drawImage(cv, 0, 0, tw, th);
      c2.toBlob(function (thumb) {
        var rec = { id: t, t: t, w: sw, h: sh, thumb: thumb, saved: false };
        tx(['photos', 'full'], 'readwrite', function (x) {
          x.objectStore('photos').put(rec);
          x.objectStore('full').put({ id: t, blob: full });
        }).then(function () {
          photos.unshift(rec); refreshThumb();
        }, function () { toast('しまう場所がいっぱいです。保存して消してください'); });
      }, 'image/jpeg', 0.8);
    }, 'image/jpeg', 0.92);
  }

  function urlOf(p) { if (!urls[p.id]) urls[p.id] = URL.createObjectURL(p.thumb); return urls[p.id]; }
  function refreshThumb() {
    var th = $('thumb'), n = photos.length;
    th.classList.toggle('empty', !n);
    th.style.backgroundImage = n ? 'url(' + urlOf(photos[0]) + ')' : '';
    var c = $('count'); c.hidden = !n; c.textContent = n > 99 ? '99+' : n;
  }

  // ---------- 一覧 ----------
  function openGallery() {
    show('gallery', true); show('viewer', false);
    var g = $('grid2'); g.innerHTML = '';
    var unsaved = photos.filter(function (p) { return !p.saved; }).length;
    selIds = selIds.filter(function (id) { return photos.some(function (p) { return p.id === id; }); });
    var selecting = selMode && photos.length > 0;
    g.classList.toggle('selecting', selecting);
    $('galTitle').textContent = selecting ? selIds.length + '枚 えらんだ' : photos.length + '枚';
    $('selBtn').hidden = !photos.length;
    $('selBtn').textContent = selecting ? 'やめる' : 'えらぶ';
    $('galBack').textContent = selecting ? '全部' : '← カメラ';
    $('saveAll').parentNode.hidden = !unsaved;
    $('saveAll').textContent = 'まだ保存していない写真を保存(' + unsaved + '枚)';
    if (unsaved && unsaved <= 10) preload(photos.filter(function (p) { return !p.saved; }));
    $('galNote').hidden = selecting;
    $('selBar').hidden = !selecting;
    $('selSave').disabled = $('selDel').disabled = !selIds.length;
    $('selSave').style.opacity = $('selDel').style.opacity = selIds.length ? '' : '.4';
    if (!photos.length) { selMode = false; g.innerHTML = '<div class="empty-msg">まだ写真がありません。<br>カメラにもどって、白い丸を押すと撮れます。</div>'; return; }
    photos.forEach(function (p) {
      var b = document.createElement('button'); b.type = 'button';
      b.style.backgroundImage = 'url(' + urlOf(p) + ')';
      var isSel = selIds.indexOf(p.id) >= 0;
      b.className = (p.saved ? 'saved' : '') + (isSel ? ' sel' : '');
      b.innerHTML = '<span class="ck">' + (isSel ? '✓' : '') + '</span>';
      b.setAttribute('aria-label', when(p.t) + ' の写真' + (selecting ? (isSel ? '(えらんだ)' : '') : ''));
      // 長押し(0.5秒)で えらぶ。えらんでいる間は、押すたびに えらぶ/外す
      var timer = null, longDone = false;
      b.addEventListener('pointerdown', function () { longDone = false; clearTimeout(timer); timer = setTimeout(function () { longDone = true; if (navigator.vibrate) try { navigator.vibrate(20); } catch (e) {} if (!selMode) { selMode = true; selIds = []; } toggleSel(p); }, 500); });
      ['pointerup', 'pointercancel', 'pointerleave'].forEach(function (ev) { b.addEventListener(ev, function () { clearTimeout(timer); }); });
      b.addEventListener('contextmenu', function (e) { e.preventDefault(); });
      b.onclick = function () { if (longDone) { longDone = false; return; } if (selMode) toggleSel(p); else openViewer(p); };
      g.appendChild(b);
    });
  }
  var selMode = false, selIds = [];
  function toggleSel(p) {
    var i = selIds.indexOf(p.id);
    if (i >= 0) { selIds.splice(i, 1); forget([p]); } else { selIds.push(p.id); preload([p]); }
    var y = $('grid2').scrollTop; openGallery(); $('grid2').scrollTop = y;
  }
  function selected() { return photos.filter(function (p) { return selIds.indexOf(p.id) >= 0; }); }
  function when(t) { var d = new Date(t); return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + d.getHours() + ':' + ('0' + d.getMinutes()).slice(-2); }
  function fname(t) { var d = new Date(t), z = function (n) { return ('0' + n).slice(-2); }; return 'shizuka_' + d.getFullYear() + z(d.getMonth() + 1) + z(d.getDate()) + '_' + z(d.getHours()) + z(d.getMinutes()) + z(d.getSeconds()) + '.jpg'; }

  var cur = null, curUrl = null;
  function openViewer(p) {
    cur = p; show('viewer', true);
    $('vwTitle').textContent = when(p.t);
    $('vwImg').src = urlOf(p);
    getFull(p.id).then(function (b) { if (!b || cur !== p) return; if (curUrl) URL.revokeObjectURL(curUrl); curUrl = URL.createObjectURL(b); $('vwImg').src = curUrl; });
    $('vwSave').textContent = p.saved ? '📥 もう一度保存' : '📥 写真アプリに保存';
    preload([p]);
  }

  // ---------- 保存(共有の画面で「画像を保存」) ----------
  // iPhone は「押したその瞬間」にしか共有の画面を開かせてくれない。
  // 押してから写真を取り出していると間に合わず、断られる(2026-11-09 ノブさん「iPhone でダウンロードできない」)。
  // → 写真は先に取り出しておく。間に合わなかったときは「保存する」をもう一度押してもらう。
  var fileCache = {};
  function loadFile(p) {
    if (fileCache[p.id]) return Promise.resolve(fileCache[p.id]);
    return getFull(p.id).then(function (b) { var f = new File([b], fname(p.t), { type: 'image/jpeg' }); fileCache[p.id] = f; return f; });
  }
  function preload(list) { list.forEach(function (p) { loadFile(p).catch(function () {}); }); }
  function forget(list) { list.forEach(function (p) { delete fileCache[p.id]; }); }
  function saveList(list) {
    var files = list.map(function (p) { return fileCache[p.id]; });
    var go;
    if (files.every(Boolean)) go = shareFiles(files);          // 準備ずみ → 押した瞬間に開く
    else go = Promise.all(list.map(loadFile)).then(function (fs) {
      return new Promise(function (res) {
        ask((fs.length > 1 ? fs.length + '枚の' : '') + '写真の準備ができました。「保存する」を押してください。', function () { res(shareFiles(fs)); }, '保存する', 'やめる', function () { res(false); });
      });
    });
    return go.then(function (ok) {
      if (!ok) return;
      list.forEach(function (p) { p.saved = true; }); forget(list);
      return tx(['photos'], 'readwrite', function (x) { list.forEach(function (p) { x.objectStore('photos').put(p); }); });
    });
  }
  // 押した瞬間に呼ぶこと(この中で待たない)
  function shareFiles(files, again) {
    var canShare = false;
    try { canShare = !!(navigator.share && navigator.canShare && navigator.canShare({ files: files })); } catch (e) {}
    if (!canShare) return Promise.resolve(isIOS ? longPressHelp() : download(files));
    if (isIOS) toast('出てきた画面で「' + (files.length > 1 ? files.length + '枚の画像を保存' : '画像を保存') + '」を押してください');
    // スマホによっては、保存せずに戻っても「できた」と返ってくる。だから、本人に聞いてから「保存ずみ」にする
    return navigator.share({ files: files }).then(function () { return askSaved(files.length); }, function (e) {
      if (e && e.name === 'AbortError') return false;              // 自分でやめた
      if (!again) return new Promise(function (res) {               // 断られた → もう一度押してもらう
        ask('もう一度「保存する」を押してください。', function () { res(shareFiles(files, true)); }, '保存する', 'やめる', function () { res(false); });
      });
      return isIOS ? longPressHelp() : download(files);
    });
  }
  // 最後の手: 1枚の画面で、写真を長押し →「写真に追加」
  function longPressHelp() {
    return new Promise(function (res) {
      ask('うまく開けませんでした。1枚ずつ開いて、写真を長押しすると「写真に追加」で保存できます。', function () { res(false); }, 'わかった', '閉じる', function () { res(false); });
    });
  }
  function download(files) {
    files.forEach(function (f, i) {
      setTimeout(function () {
        var a = document.createElement('a'), u = URL.createObjectURL(f);
        a.href = u; a.download = f.name; document.body.appendChild(a); a.click(); a.remove();
        setTimeout(function () { URL.revokeObjectURL(u); }, 4000);
      }, i * 350);
    });
    toast(isIOS ? '「ファイル」アプリに入りました' : 'ダウンロードに入りました');
    return true;
  }

  function ask(msg, yes, yesLabel, noLabel, no) {
    $('cfMsg').textContent = msg; show('confirm', true);
    $('cfYes').textContent = yesLabel || '消す'; $('cfNo').textContent = noLabel || 'やめる';
    $('cfYes').onclick = function () { show('confirm', false); yes(); };
    $('cfNo').onclick = function () { show('confirm', false); if (no) no(); };
  }
  function askSaved(n) {
    return new Promise(function (res) {
      ask((n > 1 ? n + '枚の写真を' : '写真を') + '、写真アプリに保存できましたか?', function () { res(true); }, 'できた', 'まだ', function () { toast('「保存ずみ」にはしていません'); res(false); });
    });
  }
  function del(p) { delMany([p]); }
  function delMany(list) {
    tx(['photos', 'full'], 'readwrite', function (x) { list.forEach(function (p) { x.objectStore('photos').delete(p.id); x.objectStore('full').delete(p.id); }); }).then(function () {
      photos = photos.filter(function (q) { return list.indexOf(q) < 0; }); forget(list);
      list.forEach(function (p) { if (urls[p.id]) { URL.revokeObjectURL(urls[p.id]); delete urls[p.id]; } });
      selMode = false; selIds = [];
      refreshThumb(); openGallery(); toast(list.length > 1 ? list.length + '枚 消しました' : '消しました');
    });
  }

  // ---------- ボタン ----------
  $('startBtn').onclick = startCam;
  $('retryBtn').onclick = startCam;
  $('shutter').onclick = function () { shoot(); this.blur(); };
  $('flip').onclick = function () { facing = facing === 'user' ? 'environment' : 'user'; startCam(); this.blur(); };
  $('gridBtn').onclick = function () {
    var on = $('grid').hidden; $('grid').hidden = !on; this.classList.toggle('on', on); this.setAttribute('aria-pressed', on); store('grid', on ? '1' : '0'); this.blur();
  };
  $('thumb').onclick = function () { selMode = false; selIds = []; openGallery(); };
  $('toGallery').onclick = function () { selMode = false; selIds = []; openGallery(); };
  $('galBack').onclick = function () {
    if (selMode) { selIds = selIds.length === photos.length ? [] : photos.map(function (p) { return p.id; }); preload(selected()); openGallery(); return; }
    show('gallery', false); if (!stream) startCam();
  };
  $('selBtn').onclick = function () { selMode = !selMode; selIds = []; openGallery(); };
  $('selSave').onclick = function () {
    var list = selected(); if (!list.length) return;
    saveList(list).then(function () { if (list.every(function (p) { return p.saved; })) { toast('保存しました'); selMode = false; selIds = []; } openGallery(); });
  };
  $('selDel').onclick = function () {
    var list = selected(); if (!list.length) return;
    var un = list.filter(function (p) { return !p.saved; }).length;
    ask(list.length + '枚を、このアプリから消します。' + (un ? '(そのうち ' + un + '枚は、まだ保存していません。消すと元にもどせません)' : '(写真アプリに保存したものは残ります)'), function () { delMany(list); });
  };
  $('vwBack').onclick = function () { openGallery(); };
  $('vwSave').onclick = function () { var p = cur; saveList([p]).then(function () { if (p.saved) { toast('保存しました'); openViewer(p); } }); };
  $('vwDel').onclick = function () {
    var p = cur;
    ask(p.saved ? 'この写真を、このアプリから消します。(写真アプリに保存したものは残ります)' : 'この写真は、まだ保存していません。消すと元にもどせません。消しますか?', function () { del(p); });
  };
  $('saveAll').onclick = function () {
    var list = photos.filter(function (p) { return !p.saved; });
    if (list.length) saveList(list).then(function () { if (list.every(function (p) { return p.saved; })) toast('保存しました'); openGallery(); });
  };
  // 音量ボタンは、ブラウザのアプリからは使えない(スマホの決まり)ので、画面の白い丸で撮る。
  document.addEventListener('keydown', function (e) { if ((e.key === ' ' || e.key === 'Enter') && stream && $('gallery').hidden) { e.preventDefault(); shoot(); } });

  // ほかのアプリに切りかえたらカメラを止め、もどったらつけなおす(電池とカメラのランプのため)
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) stopCam();
    else if (store('started') === '1' && $('start').hidden && $('trouble').hidden && $('gallery').hidden) startCam();
  });

  if (store('grid') === '1') { $('grid').hidden = false; $('gridBtn').classList.add('on'); }
  getAll().then(function (list) { photos = list.sort(function (a, b) { return b.t - a.t; }); refreshThumb(); }, function () {});

  // はじめの画面(インストール)を閉じたら、そのままカメラをひらく
  window.SHIZUKA_START = function () { if (store('started') === '1') startCam(); };
  // 前にカメラを使ったことがあり、はじめの画面が出ていなければ、すぐひらく
  setTimeout(function () { if (store('started') === '1' && !document.getElementById('igGate')) startCam(); }, 0);
})();
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(function () {});
</script>

    points: ['シャッター音が鳴らない', '1×・2×・3× のズーム、前と後ろのカメラ', '撮った写真は、まとめて写真アプリに保存'],
    shots: ['shots/1.jpg', 'shots/2.jpg', 'shots/3.jpg'], playLabel: '▶ このまま使う', laterLabel: 'あとで(このまま使う)',
    badges: ['無料', '広告なし', '登録なし'], onPlay: function () { window.SHIZUKA_START && window.SHIZUKA_START(); } };
